name: Build & Push FLUX to Docker Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push FLUX RunPod image
        run: |
          docker build --pull -f tools/Dockerfile.flux \
            -t hrm3478938/flux-serverless:latest tools/
          docker push hrm3478938/flux-serverless:latest

      - name: Build & Push FLUX Salad HTTP image
        run: |
          docker build --pull -f tools/Dockerfile.http \
            -t hrm3478938/flux-http:latest tools/
          docker push hrm3478938/flux-http:latest
