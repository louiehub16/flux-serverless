name: Build & Push FLUX to Docker Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_REPO: hrm3478938/flux-serverless

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push FLUX image
        run: |
          docker build --pull -f tools/Dockerfile.flux \
            -t ${{ env.DOCKERHUB_REPO }}:latest \
            -t ${{ env.DOCKERHUB_REPO }}:${{ github.sha }} tools/
          docker push --all-tags ${{ env.DOCKERHUB_REPO }}
